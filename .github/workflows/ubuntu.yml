name: ubuntu

on:
  push:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - '/*.sh'
      - '/.*'
      - '/_*'
      - 'Brewfile'
      - 'docs/**'
      - '**.adoc'
      - '**.md'
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/*.yml'
      - '!.github/workflows/ubuntu.yml'
  pull_request:
    paths-ignore:
      - '/*.sh'
      - '/.*'
      - '/_*'
      - 'Brewfile'
      - 'docs/**'
      - '**.adoc'
      - '**.md'
      - '**.nix'
      - 'flake.lock'

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} [CC ${{ matrix.env.CC }}; ${{ matrix.backend.name }}; shared libs ${{ matrix.shared_libs }}; GnuPG stable]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04 ]
        shared_libs: [ 'on' ]
        backend:
          - { name: 'botan',    package: 'libbotan-2-dev' }
          - { name: 'openssl',  package: 'libssl-dev'     }
        env:
          - { CC: gcc,    CXX: g++     }
          - { CC: clang,  CXX: clang++ }
        include:
        # Ubuntu 22.04 LTS (jammy) coverage moved to the tests-jammy-container
        # job below: the ubuntu-22.04 runner image entered deprecation on
        # 2026-09-17 (actions/runner-images#14254, fully unsupported
        # 2027-04-17), so jammy is tested as a container on a current runner.
        # OpenSSL 1.1.1 coverage: ubuntu runners no longer ship openssl 1.1.x
        # in apt (ubuntu-22.04+ moved to 3.x). OpenSSL 1.1.1 is exercised via
        # containers in centos-and-fedora.yml (RHEL 8 ubi) and debian.yml
        # (Debian 11), both of which ship openssl 1.1 in their distro repos.

          # Static-link sanity check
          - os: ubuntu-24.04
            shared_libs: 'off'
            backend: { name: 'botan',    package: 'libbotan-2-dev' }
            env: { CC: gcc, CXX: g++ }

          # ARM64 Linux (native runner; Thunderbird-on-ARM-Linux is a growing audience)
          - os: ubuntu-24.04-arm
            shared_libs: 'on'
            backend: { name: 'botan',    package: 'libbotan-2-dev' }
            env: { CC: gcc, CXX: g++ }

          - os: ubuntu-24.04-arm
            shared_libs: 'on'
            backend: { name: 'openssl',  package: 'libssl-dev' }
            env: { CC: gcc, CXX: g++ }

    if: "!contains(github.event.head_commit.message, 'skip ci')"
    env: ${{ matrix.env }}
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - name: Install dependencies
#     Already installed on GHA: build-essential libbz2-dev zlib1g-dev
        run: |
          sudo apt-get -y update
          sudo apt-get -y install cmake libbz2-dev ${{ matrix.backend.package }} asciidoctor

      - name: Configure
        run: |
          echo CORES="$(nproc --all)" >> $GITHUB_ENV
          cmake -B build   -DBUILD_SHARED_LIBS=${{ matrix.shared_libs}}   \
                           -DCRYPTO_BACKEND=${{ matrix.backend.name }}    \
                           -DDOWNLOAD_GTEST=ON                            \
                           -DCMAKE_BUILD_TYPE=Release -DENABLE_DOC=Off .

      - name: Build
        run: cmake --build build --parallel ${{ env.CORES }}

      - name: Test
        run: |
          mkdir -p "build/Testing/Temporary"
          cp "cmake/CTestCostData.txt" "build/Testing/Temporary"
          export PATH="$PWD/build/src/lib:$PATH"
          ctest --parallel 1 --test-dir build --output-on-failure -E '_slow$'

  # Ubuntu 22.04 LTS (jammy) coverage as a container on a current runner:
  # the ubuntu-22.04 runner image entered deprecation on 2026-09-17 and is
  # fully unsupported 2027-04-17 (actions/runner-images#14254). Jammy ships
  # Botan 2.19.1 (older 2.x than noble's 2.19.3) and OpenSSL 3.0, and GnuPG
  # 2.2, keeping the same coverage the native ubuntu-22.04 runner provided.
  # Node.js 22 is installed before checkout because JS actions need it and
  # the bare ubuntu image does not ship it; the test suite runs as a
  # non-root user (as in opensuse.yml) because several tests exercise
  # permission-denied paths.
  tests-jammy-container:
    name: ubuntu:22.04 container [CC gcc; ${{ matrix.backend.name }}; GnuPG stable]
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 50
    env:
      CC: gcc
      CXX: g++
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        backend:
          - { name: 'botan',   package: 'libbotan-2-dev' }
          - { name: 'openssl', package: 'libssl-dev'     }
    steps:
      - name: Install container toolchain
        run: |
          apt-get -y update
          apt-get -y install curl ca-certificates git gnupg python3 sudo build-essential cmake libbz2-dev zlib1g-dev ${{ matrix.backend.package }}
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get -y install nodejs

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup environment
        run: |
          groupadd rnpuser
          useradd -g rnpuser -m rnpuser
          printf "\nrnpuser\tALL=(ALL)\tNOPASSWD:\tALL" > /etc/sudoers.d/rnpuser

      - name: Configure
        run: |
          echo CORES="$(nproc --all)" >> $GITHUB_ENV
          cmake -B build   -DBUILD_SHARED_LIBS=on                     \
                           -DCRYPTO_BACKEND=${{ matrix.backend.name }} \
                           -DDOWNLOAD_GTEST=ON                         \
                           -DCMAKE_BUILD_TYPE=Release -DENABLE_DOC=Off .

      - name: Build
        run: cmake --build build --parallel ${{ env.CORES }}

      - name: Test
        run: |
          mkdir -p "build/Testing/Temporary"
          cp "cmake/CTestCostData.txt" "build/Testing/Temporary"
          export PATH="$PWD/build/src/lib:$PATH"
          chown -R rnpuser:rnpuser "$PWD" "build/Testing/Temporary"
          exec su rnpuser -c "ctest --parallel 1 --test-dir build --output-on-failure -E '_slow$'"

  # Issue #2347: some code paths can overrun the default stack size.
  # This leg runs the unit tests under a 256 KiB stack so overruns fail
  # loudly in CI rather than only on constrained deployments.
  tests-limited-stack:
    name: ubuntu-24.04 limited-stack [CC gcc; botan]
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 40
    env:
      CORES: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install cmake libbz2-dev libbotan-2-dev googletest

      - name: Configure
        run: |
          cmake -B build -DBUILD_SHARED_LIBS=ON \
                -DCRYPTO_BACKEND=botan \
                -DDOWNLOAD_GTEST=ON \
                -DCMAKE_BUILD_TYPE=Release -DENABLE_DOC=Off .

      - name: Build
        run: cmake --build build --parallel ${{ env.CORES }}

      - name: Test with a 256 KiB stack
        run: |
          mkdir -p "build/Testing/Temporary"
          cp "cmake/CTestCostData.txt" "build/Testing/Temporary"
          export PATH="$PWD/build/src/lib:$PATH"
          # ulimit -s takes kilobytes; 256 KiB is the budget from issue #2347.
          ulimit -s 256
          ctest --parallel 1 --test-dir build --output-on-failure -E '_slow$'

  cmake-offline-googletest-src:
    # pinned: ubuntu-latest migrated to 26.04, whose apt dropped botan2
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install cmake libbz2-dev libbotan-2-dev asciidoctor googletest

      - name: Configure
        run: |
          echo CORES="$(nproc --all)" >> $GITHUB_ENV
          cmake -B build   -DBUILD_SHARED_LIBS=ON              \
                           -DCRYPTO_BACKEND=botan              \
                           -DDOWNLOAD_GTEST=OFF                \
                           -DGTEST_SOURCES=/usr/src/googletest \
                           -DCMAKE_BUILD_TYPE=Release          .

      - name: Build
        run: cmake --build build --parallel ${{ env.CORES }}

      - name: Test
        run: |
          mkdir -p "build/Testing/Temporary"
          cp "cmake/CTestCostData.txt" "build/Testing/Temporary"
          export PATH="$PWD/build/src/lib:$PATH"
          ctest --parallel 1 --test-dir build --output-on-failure -E '_slow$'

      - name: Check googletest
        run: |
          [ -d "build/src/tests" ]
          [ -d "build/src/tests/googletest-build" ]
          [ ! -d "build/src/tests/googletest-src" ]

  cmake-offline-googletest:
    # pinned: ubuntu-latest migrated to 26.04, whose apt dropped botan2
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install cmake libbz2-dev libbotan-2-dev asciidoctor googletest

      - name: Build googletest
        run: |
          cmake -B googletest-build /usr/src/googletest
          cmake --build googletest-build
          sudo cmake --install googletest-build

      - name: Configure
        run: |
          echo CORES="$(nproc --all)" >> $GITHUB_ENV
          cmake -B build   -DBUILD_SHARED_LIBS=ON              \
                           -DCRYPTO_BACKEND=botan              \
                           -DDOWNLOAD_GTEST=OFF                \
                           -DCMAKE_BUILD_TYPE=Release          .

      - name: Build
        run: cmake --build build --parallel ${{ env.CORES }}

      - name: Test
        run: |
          mkdir -p "build/Testing/Temporary"
          cp "cmake/CTestCostData.txt" "build/Testing/Temporary"
          export PATH="$PWD/build/src/lib:$PATH"
          ctest --parallel 1 --test-dir build --output-on-failure -E '_slow$'

      - name: Check googletest
        run: |
          [ -d "build/src/tests" ]
          [ ! -d "build/src/tests/googletest-build" ]
          [ ! -d "build/src/tests/googletest-src" ]

  cmake-system-sexpp:
    name: system-sexpp, sexpp shared libs ${{ matrix.sexpp_shared_libs }}, rnp shared libs ${{ matrix.rnp_shared_libs }}
    # pinned: ubuntu-latest migrated to 26.04, whose apt dropped botan2
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sexpp_shared_libs: [ 'on', 'off' ]
        rnp_shared_libs: ['on', 'off']

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install cmake libbz2-dev libbotan-2-dev asciidoctor

      - name: Checkout sexpp
        uses: actions/checkout@v7
        with:
          repository: rnpgp/sexpp
          path: sexpp

      - name: Configure sexpp
        run: |
          echo CORES="$(nproc --all)" >> $GITHUB_ENV
          cmake -S sexpp -B sexpp/build       \
                -DCMAKE_BUILD_TYPE=Release    \
                -DDOWNLOAD_GTEST=OFF          \
                -DWITH_SEXP_TESTS=OFF         \
                -DBUILD_SHARED_LIBS=${{ matrix.sexpp_shared_libs}}

      - name: Build sexpp
        run: cmake --build sexpp/build  --parallel ${{ env.CORES }}

      - name: Install sexpp
        run: sudo cmake --install sexpp/build

      - name: Clean sexpp
        run: rm -rf sexpp

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Configure
        run: |
          cmake -B build                                           \
                -DBUILD_SHARED_LIBS=${{ matrix.rnp_shared_libs }}  \
                -DCRYPTO_BACKEND=botan                             \
                -DDOWNLOAD_GTEST=ON                                \
                -DSYSTEM_LIBSEXPP=ON                               \
                -DCMAKE_BUILD_TYPE=Release                         .

      - name: Build
        run: cmake --build build --parallel ${{ env.CORES }}

      - name: Test
        run: |
          mkdir -p "build/Testing/Temporary"
          cp "cmake/CTestCostData.txt" "build/Testing/Temporary"
          export PATH="$PWD/build/src/lib:$PATH"
          ctest --parallel 1 --test-dir build -R rnp_tests --output-on-failure -E '_slow$'

  package-source:
    # pinned: ubuntu-latest migrated to 26.04, whose apt dropped botan2
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install cmake libbz2-dev libbotan-2-dev asciidoctor

      - name: Configure
        run: |
          cmake . -B build                    \
                  -DBUILD_SHARED_LIBS=ON      \
                  -DBUILD_TESTING=OFF         \
                  -DCMAKE_BUILD_TYPE=Release  \
                  -DCRYPTO_BACKEND=botan      \
                  -DCMAKE_INSTALL_PREFIX=/usr

      - name: Package source
        run: cpack -B build/source-deb -G DEB --config build/CPackSourceConfig.cmake

      - name: Upload source package
        uses: actions/upload-artifact@v7
        with:
          name: 'source-debian'
          path: 'build/source-deb/*.deb'
          retention-days: 5

      - name: Stash packaging tests
        uses: actions/upload-artifact@v7
        with:
          name: tests
          path: 'ci/tests/**'
          retention-days: 1

  package:
    # pinned: ubuntu-latest migrated to 26.04, whose apt dropped botan2
    runs-on: ubuntu-24.04
    needs: package-source
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install cmake libbz2-dev libbotan-2-dev asciidoctor

      - name: Download source package
        uses: actions/download-artifact@v8
        with:
          name: 'source-debian'
          path: source-debian

      - name: Extract sources
        run: dpkg-deb --extract source-debian/*.deb rnp

      - name: Configure
        run: |
          echo CORES="$(nproc --all)" >> $GITHUB_ENV
          cmake rnp -B rnp/build                \
                    -DBUILD_SHARED_LIBS=ON      \
                    -DBUILD_TESTING=OFF         \
                    -DCMAKE_BUILD_TYPE=Release  \
                    -DCRYPTO_BACKEND=botan      \
                    -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build rnp/build --config Release --parallel ${{ env.CORES }}

      - name: Create binary package
        run: cpack -G DEB -B debian --config rnp/build/CPackConfig.cmake

      - name: Upload binary package
        uses: actions/upload-artifact@v7
        with:
          name: 'debian'
          path: 'debian/*.deb'
          retention-days: 5

  debian-tests:
    # pinned: ubuntu-latest migrated to 26.04, whose apt dropped botan2
    runs-on: ubuntu-24.04
    needs: package
    timeout-minutes: 30
    steps:
      - name: Download enp deb file
        uses: actions/download-artifact@v8
        with:
          name: 'debian'

      - name: Checkout shell test framework
        uses: actions/checkout@v7
        with:
          repository: kward/shunit2
          path: ci/tests/shunit2

      - name: Unstash tests
        uses: actions/download-artifact@v8
        with:
          name: tests
          path: ci/tests

      - name: Run debian tests
#  - no source checkout or upload [we get only test scripts from the previous step using GHA artifacts]
#  - no environment set up with rnp scripts
#  - no dependencies setup, we test that apt can install whatever is required
        run:  |
          chmod +x ci/tests/deb-tests.sh
          ci/tests/deb-tests.sh
