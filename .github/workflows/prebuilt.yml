name: prebuilt

# Builds per-target static-library tarballs of librnp + dependency stack.
#
# Triggered three ways:
#
#   * pull_request  -- runs on PRs touching the build scripts or this
#                      workflow. Uploads the resulting tarballs as
#                      workflow artifacts (under the "prebuilt" name)
#                      instead of attaching to a release, so reviewers
#                      can download and verify without a real release.
#                      This trigger exists only while the prebuilt
#                      infrastructure is under active development; in
#                      production only the release trigger fires.
#
#   * workflow_call -- called from .github/workflows/release.yml after
#                      the GitHub release exists. Uploads the tarballs
#                      to that release as additional assets.
#
#   * workflow_dispatch -- manual run against an existing release tag
#                          (useful for re-building prebuilts for an
#                          older release without re-pushing the tag).
#                          Uploads to the named release.
#
# Orchestration (mirrors the pattern in centos-and-fedora.yml and
# time-machine.yml: a config phase emits a matrix, a build phase
# produces an artifact, a downstream phase downloads it):
#
#   config       -- single source of truth for the target list; emits
#                   two matrices via jq (unix_targets, rnp_matrix).
#   build-deps   -- Phase 1: builds zlib+bzip2+json-c once per Unix
#                   target and uploads $prefix as an artifact. Both
#                   per-backend rnp jobs for the same target download
#                   it instead of rebuilding common deps.
#   build-rnp    -- Phase 2: per (target, backend). Unix targets
#                   download the deps artifact from Phase 1 and run
#                   `build_prebuilt.sh rnp`. Windows runs the
#                   monolithic PowerShell pass (vcpkg deps are not
#                   cleanly splittable via artifacts).

on:
  pull_request:
    paths:
      - 'ci/build_prebuilt.sh'
      - 'ci/build_prebuilt.ps1'
      - 'ci/botan3-modules'
      - 'ci/botan3-pqc-modules'
      - 'ci/prebuilt-versions.env'
      - 'ci/backends/*.env'
      - 'ci/targets/*.env'
      - '.github/workflows/prebuilt.yml'
  workflow_call:
    inputs:
      tag:
        description: 'Tag being released (e.g. v0.18.1)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach assets to (e.g. v0.18.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Cancel in-progress runs when a new push lands on the same PR or
  # branch. Avoids CI waste from superseded pushes.
  group: prebuilt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # On PRs there is no real release tag; use a placeholder so the
  # tarball name is still well-formed. The tarball contents come from
  # the PR HEAD, not the placeholder. The placeholder uses `+` (semver
  # build metadata) rather than `-` so the test parser's
  # version/target split (which splits on `-`) stays unambiguous.
  RELEASE_TAG: ${{ inputs.tag || 'v0.0.0+prtest' }}

jobs:
  # ---------------------------------------------------------------------------
  # config: single source of truth for the target list.
  #
  # Adding a target = adding one object to the targets array. Adding a
  # backend = adding it to the backends array. The downstream matrices
  # (unix_targets for the deps phase, rnp_matrix for the per-backend
  # rnp phase) are derived via jq so the target list is declared once.
  # ---------------------------------------------------------------------------
  config:
    name: Configure matrix
    runs-on: ubuntu-latest
    outputs:
      unix_targets: ${{ steps.gen.outputs.unix_targets }}
      rnp_matrix: ${{ steps.gen.outputs.rnp_matrix }}
    steps:
      - id: gen
        run: |
          set -euo pipefail
          cat > /tmp/targets.json <<'JSON'
          [
            {"triple":"x86_64-unknown-linux-gnu","runner":"ubuntu-latest","container":""},
            {"triple":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm","container":""},
            {"triple":"x86_64-unknown-linux-musl","runner":"ubuntu-latest","container":"alpine:latest"},
            {"triple":"aarch64-unknown-linux-musl","runner":"ubuntu-24.04-arm","container":"alpine:latest"},
            {"triple":"x86_64-apple-darwin","runner":"macos-13","container":""},
            {"triple":"aarch64-apple-darwin","runner":"macos-14","container":""},
            {"triple":"x86_64-pc-windows-msvc","runner":"windows-latest","container":""}
          ]
          JSON

          # Unix targets = everything except *-msvc (Windows runs
          # monolithically in build-rnp; its deps come from vcpkg and
          # are not cleanly splittable via artifacts).
          unix_targets=$(jq -c \
            '[.[] | select(.triple | endswith("msvc") | not)]' \
            /tmp/targets.json)

          # Full cartesian product (target × backend), wrapped under
          # a `target` key so matrix consumers read
          # matrix.target.triple / matrix.target.runner / etc.
          rnp_matrix=$(jq -c \
            '. as $ts
             | ["botan","openssl"] as $bs
             | [ $ts[] | . as $t | $bs[] | {target: $t, backend: .} ]' \
            /tmp/targets.json)

          echo "unix_targets=$unix_targets" >> "$GITHUB_OUTPUT"
          echo "rnp_matrix=$rnp_matrix"     >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # build-deps (Phase 1): common deps (zlib, bzip2, json-c) built once
  # per Unix target. Uploaded as an artifact and consumed by both
  # per-backend rnp jobs for the same target, so the 12 Unix rnp jobs
  # skip dep building entirely.
  # ---------------------------------------------------------------------------
  build-deps:
    needs: config
    name: deps / ${{ matrix.target.triple }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.config.outputs.unix_targets) }}
    runs-on: ${{ matrix.target.runner }}
    container: ${{ matrix.target.container }}
    env:
      # Job-level default; bash steps override to $GITHUB_WORKSPACE
      # for container-correctness. JS actions read this (host path)
      # and the container mount makes the two equivalent.
      RNP_ARTIFACT_DIR: ${{ github.workspace }}/work/artifacts
    steps:
      - name: Install build dependencies (Linux glibc)
        if: runner.os == 'Linux' && matrix.target.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 xz-utils pkg-config curl

      - name: Install build dependencies (Linux musl / alpine)
        if: runner.os == 'Linux' && matrix.target.container != ''
        run: |
          apk add --no-cache \
            git bash util-linux build-base cmake python3 perl linux-headers xz curl tar gzip \
            coreutils pkgconf

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config python@3.12 xz
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      # Alpine containers don't ship git, and the musl+ARM64 jobs
      # specifically can't use actions/checkout (a JS action that
      # GitHub Actions refuses to run inside alpine on ARM64).
      - name: Pre-checkout setup (alpine containers only)
        if: matrix.target.container != ''
        run: apk add --no-cache git

      - name: Checkout rnp (container)
        if: matrix.target.container != ''
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          git config --global --add safe.directory '*'
          ref="${{ inputs.tag || github.event.pull_request.head.sha || github.ref }}"
          ref="${ref#refs/tags/}"
          ref="${ref#refs/heads/}"
          shopt -s nullglob dotglob
          existing=( "$(pwd)"/* )
          shopt -u nullglob dotglob
          if (( ${#existing[@]} > 0 )); then
              echo "ERROR: workspace is not empty before container checkout:" >&2
              printf '  %s\n' "${existing[@]}" >&2
              exit 1
          fi
          git init .
          git remote add origin "${{ github.event.repository.clone_url }}"
          git fetch --depth 1 origin "$ref"
          git checkout --force FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Checkout rnp (no container)
        if: matrix.target.container == ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.ref }}
          submodules: recursive

      # Dep cache keyed by target only (not target+backend) so both
      # backends' rnp jobs benefit from the same dep build. The cache
      # also speeds up re-runs of this build-deps job itself.
      - name: Restore dep cache
        if: matrix.target.container == '' || matrix.target.triple != 'aarch64-unknown-linux-musl'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/work/prefix
          key: deps-${{ matrix.target.triple }}-${{ hashFiles('ci/prebuilt-versions.env') }}
          restore-keys: |
            deps-${{ matrix.target.triple }}-

      - name: Build common deps (zlib, bzip2, json-c)
        run: |
          # Inside containers, $GITHUB_WORKSPACE points at the mount
          # root (e.g. /__w/rnp/rnp), while ${{ github.workspace }}
          # in expressions resolves to the host-side path that isn't
          # visible from the container. Always use $GITHUB_WORKSPACE
          # for paths the build writes to so they land on the mount
          # and are visible to the JS actions that read them.
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export RNP_ARTIFACT_DIR="$GITHUB_WORKSPACE/work/artifacts"
          mkdir -p "$RNP_ARTIFACT_DIR" "$CCACHE_DIR"
          command -v ccache >/dev/null 2>&1 || {
              if command -v apt-get >/dev/null; then
                  sudo apt-get install -y --no-install-recommends ccache
              elif command -v brew >/dev/null; then
                  brew install ccache
              fi
          }
          bash ci/build_prebuilt.sh deps \
            "${{ matrix.target.triple }}" \
            "$GITHUB_WORKSPACE/work"

      # Upload the dep prefix as an artifact. Both backend rnp jobs
      # for this target download it instead of rebuilding.
      # Skipped on alpine+ARM64: GitHub Actions refuses to run JS
      # actions (cache, upload-artifact, etc.) in alpine containers
      # on ARM64 runners. The build-deps job still runs and produces
      # a usable prefix; the corresponding build-rnp entry falls back
      # to building deps inline via the rnp script's self-healing
      # path.
      - name: Upload deps artifact
        if: matrix.target.container == '' || matrix.target.triple != 'aarch64-unknown-linux-musl'
        uses: actions/upload-artifact@v7
        with:
          name: deps-${{ matrix.target.triple }}
          path: ${{ github.workspace }}/work/prefix/
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # build-rnp (Phase 2): per (target, backend) rnp build + package.
  #
  # Unix targets download the deps artifact from build-deps and run
  # `build_prebuilt.sh rnp` (deps already in $prefix). Windows runs
  # the monolithic PowerShell pass — vcpkg installs all deps (common
  # + backend) in one shot; splitting via artifacts would require
  # packaging the entire vcpkg install dir, which is fragile.
  # ---------------------------------------------------------------------------
  build-rnp:
    needs: [config, build-deps]
    name: ${{ matrix.target.triple }} / ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.config.outputs.rnp_matrix) }}
    runs-on: ${{ matrix.target.runner }}
    container: ${{ matrix.target.container }}
    env:
      # Job-level default; bash steps override to $GITHUB_WORKSPACE
      # for container-correctness. JS actions read this (host path)
      # and the container mount makes the two equivalent.
      RNP_ARTIFACT_DIR: ${{ github.workspace }}/work/artifacts
    steps:
      - name: Install build dependencies (Linux glibc)
        if: runner.os == 'Linux' && matrix.target.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 xz-utils pkg-config curl ccache

      - name: Install build dependencies (Linux musl / alpine)
        if: runner.os == 'Linux' && matrix.target.container != ''
        run: |
          apk add --no-cache \
            git bash util-linux build-base cmake python3 perl linux-headers xz curl tar gzip \
            coreutils pkgconf

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config python@3.12 xz ccache
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> "$GITHUB_ENV"

      - name: Pre-checkout setup (alpine containers only)
        if: matrix.target.container != ''
        run: apk add --no-cache git

      - name: Checkout rnp (container)
        if: matrix.target.container != ''
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          git config --global --add safe.directory '*'
          ref="${{ inputs.tag || github.event.pull_request.head.sha || github.ref }}"
          ref="${ref#refs/tags/}"
          ref="${ref#refs/heads/}"
          shopt -s nullglob dotglob
          existing=( "$(pwd)"/* )
          shopt -u nullglob dotglob
          if (( ${#existing[@]} > 0 )); then
              echo "ERROR: workspace is not empty before container checkout:" >&2
              printf '  %s\n' "${existing[@]}" >&2
              exit 1
          fi
          git init .
          git remote add origin "${{ github.event.repository.clone_url }}"
          git fetch --depth 1 origin "$ref"
          git checkout --force FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Checkout rnp (no container)
        if: matrix.target.container == ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.ref }}
          submodules: recursive

      - name: Import release signing key (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          RNP_RELEASE_GPG_KEY: ${{ secrets.RNP_RELEASE_GPG_KEY }}
          RNP_RELEASE_GPG_PASSPHRASE: ${{ secrets.RNP_RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$RNP_RELEASE_GPG_KEY" ]; then
            echo "RNP_RELEASE_GPG_KEY is not configured; skipping GPG signing."
            exit 0
          fi
          echo "$RNP_RELEASE_GPG_KEY" | gpg --batch --import \
            --pinentry-mode loopback \
            --passphrase "$RNP_RELEASE_GPG_PASSPHRASE"
          key_id="$(gpg --batch --list-secret-keys --with-colons \
            | awk -F: '/^sec:/ {print $5; exit}')"
          echo "RNP_GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"

      - name: Import release signing key (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RNP_RELEASE_GPG_KEY: ${{ secrets.RNP_RELEASE_GPG_KEY }}
          RNP_RELEASE_GPG_PASSPHRASE: ${{ secrets.RNP_RELEASE_GPG_PASSPHRASE }}
        run: |
          if (-not $env:RNP_RELEASE_GPG_KEY) {
            Write-Host 'RNP_RELEASE_GPG_KEY is not configured; skipping GPG signing.'
            exit 0
          }
          $gpg = Get-Command gpg -ErrorAction SilentlyContinue
          if (-not $gpg) {
            Write-Host 'gpg not found in PATH; skipping.'
            exit 0
          }
          $env:RNP_RELEASE_GPG_KEY | & $gpg.Source --batch --import `
            --pinentry-mode loopback --passphrase $env:RNP_RELEASE_GPG_PASSPHRASE
          $keyId = & $gpg.Source --batch --list-secret-keys --with-colons `
            | Select-String -Pattern '^sec:' `
            | ForEach-Object { ($_ -split ':')[4] } `
            | Select-Object -First 1
          if ($keyId) {
            "RNP_GPG_KEY_ID=$keyId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          }

      # Restore the ccache dir for the rnp build (the deps are already
      # built; ccache only covers the rnp sources now).
      - name: Restore ccache (Linux/macOS)
        if: runner.os != 'Windows' && !(matrix.target.container != '' && matrix.target.triple == 'aarch64-unknown-linux-musl')
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.target.triple }}-${{ matrix.backend }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target.triple }}-${{ matrix.backend }}-

      # Restore vcpkg cache for Windows. Keyed by target+backend
      # because the backend dep (botan vs openssl) is different.
      - name: Restore vcpkg cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\buildtrees
            C:\vcpkg\packages
          key: vcpkg-${{ matrix.target.triple }}-${{ matrix.backend }}-${{ hashFiles('ci/build_prebuilt.ps1') }}
          restore-keys: |
            vcpkg-${{ matrix.target.triple }}-${{ matrix.backend }}-

      # Unix only: restore the deps artifact from Phase 1 so the rnp
      # build finds zlib+bzip2+json-c in $prefix without rebuilding.
      # Skipped on alpine+ARM64 (no Phase 1 artifact was uploaded
      # because GitHub Actions refuses JS actions in alpine+ARM64
      # containers). The rnp script's self-healing path builds deps
      # inline for that one target.
      - name: Download deps artifact (Unix)
        if: runner.os != 'Windows' && (matrix.target.container == '' || matrix.target.triple != 'aarch64-unknown-linux-musl')
        uses: actions/download-artifact@v8
        with:
          name: deps-${{ matrix.target.triple }}
          path: ${{ github.workspace }}/work/prefix

      - name: Build rnp + package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          # See build-deps step for why $GITHUB_WORKSPACE is used
          # instead of ${{ github.workspace }} here.
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export RNP_ARTIFACT_DIR="$GITHUB_WORKSPACE/work/artifacts"
          mkdir -p "$RNP_ARTIFACT_DIR" "$CCACHE_DIR"
          bash ci/build_prebuilt.sh rnp \
            "${{ matrix.backend }}" \
            "${RELEASE_TAG}" \
            "${{ matrix.target.triple }}" \
            "$GITHUB_WORKSPACE/work"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build prebuilt static libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RNP_ARTIFACT_DIR"
          pwsh -NoProfile -File "ci/build_prebuilt.ps1" \
            -Backend '${{ matrix.backend }}' \
            -Version "$RELEASE_TAG" \
            -WorkDir "$(cygpath -w "${{ github.workspace }}\\work")"

      - name: Compute sha256 of artifacts
        shell: bash
        run: |
          cd "$RNP_ARTIFACT_DIR"
          ls -la
          sha256sum rnp-*.tar.gz || true

      - name: Validate tarball against spec
        if: runner.os != 'Windows'
        run: |
          bash ci/test_prebuilt.sh "$RNP_ARTIFACT_DIR"/rnp-*.tar.gz

      - name: Validate tarball structure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          posix_dir="$(cygpath -u "$RNP_ARTIFACT_DIR")"
          bash ci/test_prebuilt.sh --no-link "$posix_dir"/rnp-*.tar.gz

      # PR runs upload artifacts so reviewers can download and verify.
      # Production runs (workflow_call / workflow_dispatch) attach to
      # the named GitHub release. aarch64-musl can't use upload-
      # artifact (alpine+ARM64 JS-action restriction); the matrix
      # status is the validation signal there.
      - name: Upload artifacts (PR review)
        if: >-
          github.event_name == 'pull_request' &&
          !(matrix.target.container != '' && matrix.target.triple == 'aarch64-unknown-linux-musl')
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-${{ matrix.target.triple }}-${{ matrix.backend }}
          path: |
            ${{ env.RNP_ARTIFACT_DIR }}/rnp-*.tar.gz
            ${{ env.RNP_ARTIFACT_DIR }}/rnp-*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Notice (aarch64-musl artifact not uploaded)
        if: matrix.target.container != '' && matrix.target.triple == 'aarch64-unknown-linux-musl' && github.event_name == 'pull_request'
        run: |
          echo "::notice title=Prebuilt artifact not uploaded::actions/upload-artifact is a JS action and refuses to run inside alpine+ARM64 containers. The tarball was built successfully (see the build step's output); the matrix status above is the validation signal. To download, run ci/build_prebuilt.sh locally on aarch64 Linux."

      - name: Upload artifacts to release (production)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.RNP_ARTIFACT_DIR }}/rnp-*.tar.gz
            ${{ env.RNP_ARTIFACT_DIR }}/rnp-*.sha256
            ${{ env.RNP_ARTIFACT_DIR }}/rnp-*.asc
          fail_on_unmatched-files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Informational job: builds the same (target, backend) twice on the
  # same runner and reports whether the tarballs are byte-identical.
  # Always exits 0 (doesn't block merge). Release-only to save CI
  # minutes during PR iteration.
  reproducibility-check:
    name: Reproducibility check
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: recursive
      - run: brew install cmake pkg-config python@3.12 xz
      - run: bash ci/check_reproducibility.sh openssl "${RELEASE_TAG}" aarch64-apple-darwin
