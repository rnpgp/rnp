#
# Cross-compile smoke builds for the secondary Linux architectures, following
# the same pattern as the android workflow: Botan is cross-built on the
# x86_64 runner, librnp is built with the cross toolchain, and the full
# rnp_tests suite executes under QEMU user-mode emulation with the target
# sysroot.

name: cross-arch

on:
  push:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - '/*.sh'
      - '/.*'
      - '/_*'
      - 'Brewfile'
      - 'docs/**'
      - '**.adoc'
      - '**.md'
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/*.yml'
      - '!.github/workflows/cross-arch.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'ci/**'
      - '.github/workflows/cross-arch.yml'

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  cross-arch-build-test:
    name: ${{ matrix.arch }} linux cross-compile (botan backend)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            triplet: riscv64-linux-gnu
            botan_cpu: riscv64
            qemu: qemu-riscv64-static
            binfmt_name: riscv64
          - arch: ppc64le
            triplet: powerpc64le-linux-gnu
            botan_cpu: ppc64le
            qemu: qemu-ppc64le-static
            binfmt_name: ppc64le
          - arch: s390x
            triplet: s390x-linux-gnu
            botan_cpu: s390x
            qemu: qemu-s390x-static
            binfmt_name: s390x
          - arch: armv7
            triplet: arm-linux-gnueabihf
            botan_cpu: armv7
            qemu: qemu-arm-static
            binfmt_name: arm

    env:
      TRIPLET: ${{ matrix.triplet }}
      DEP_PREFIX: /home/runner/cross-deps
      BOTAN_VERSION: "3.13.0"

    steps:
      - name: Checkout rnp
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Install cross toolchain and QEMU
        run: |
          # only amd64-host packages come from apt: the cross toolchain packages
          # carry the target sysroot, and the target-architecture libraries
          # (Botan, zlib, bzip2) are built from source below - foreign-architecture
          # apt packages would fight the host package set
          sudo apt-get -y update
          sudo apt-get -y install cmake ninja-build python3 pkg-config \
            g++-${{ matrix.triplet }}
          # qemu-user-static is a real package up to Ubuntu 24.04; newer
          # runner images provide the same emulator through qemu-user-binfmt.
          sudo apt-get -y install qemu-user-static || sudo apt-get -y install qemu-user-binfmt

      - name: Register binfmt for target binaries
        run: |
          # registering the architecture with binfmt_misc lets the host shell
          # execute target binaries transparently: the test suite spawns the
          # cross-compiled rnp tools with system(), which bypasses the CMake
          # cross-compiling emulator
          sudo systemctl restart systemd-binfmt.service || true
          sleep 2
          ls /proc/sys/fs/binfmt_misc | grep -q ${{ matrix.binfmt_name }}

      - name: Locate QEMU emulator
        run: |
          QEMU_BIN="$(command -v ${{ matrix.qemu }} || command -v ${{ matrix.qemu }}-unescaped 2>/dev/null || command -v $(echo ${{ matrix.qemu }} | sed 's/-static$//'))"
          test -n "$QEMU_BIN"
          echo "QEMU_BIN=$QEMU_BIN" >> $GITHUB_ENV

      - name: Cache cross-built dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ env.DEP_PREFIX }}/${{ matrix.arch }}
          key: crossarch-deps-${{ matrix.arch }}-${{ env.BOTAN_VERSION }}-zlib131-bz108

      - name: Cross-build zlib and bzip2
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$DEP_PREFIX" && cd "$DEP_PREFIX"
          curl -fSL --retry 3 -o zlib.tar.gz \
            "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
          tar xzf zlib.tar.gz
          cd zlib-1.3.1
          CC=${TRIPLET}-gcc AR=${TRIPLET}-ar ./configure --static \
            --prefix="$DEP_PREFIX/${{ matrix.arch }}"
          make -j"$(nproc)" && make install
          cd "$DEP_PREFIX"
          curl -fSL --retry 3 -o bzip2.tar.gz \
            "https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
          tar xzf bzip2.tar.gz
          cd bzip2-1.0.8
          make -j"$(nproc)" CC=${TRIPLET}-gcc AR=${TRIPLET}-ar \
            RANLIB=${TRIPLET}-ranlib libbz2.a
          # install the library and header only: the bzip2 binary target
          # links with -lbz2 and fails on a cross toolchain without -L.
          install -d "$DEP_PREFIX/${{ matrix.arch }}/lib" \
            "$DEP_PREFIX/${{ matrix.arch }}/include"
          install -m 644 bzlib.h "$DEP_PREFIX/${{ matrix.arch }}/include/"
          install -m 644 libbz2.a "$DEP_PREFIX/${{ matrix.arch }}/lib/"

      - name: Cross-build Botan
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$DEP_PREFIX" && cd "$DEP_PREFIX"
          curl -fSL --retry 3 -o botan.tar.xz \
            "https://botan.randombit.net/releases/Botan-${BOTAN_VERSION}.tar.xz"
          tar xJf botan.tar.xz
          cd "Botan-${BOTAN_VERSION}"
          python3 ./configure.py \
            --cc=gcc \
            --cc-bin="${TRIPLET}-g++" \
            --cpu=${{ matrix.botan_cpu }} \
            --os=linux \
            --minimized-build \
            --enable-modules="$(tr '\n' ',' < "$GITHUB_WORKSPACE/ci/botan3-modules" | sed 's/,$//')" \
            --build-targets=static \
            --without-documentation \
            --prefix="$DEP_PREFIX/${{ matrix.arch }}"
          make -j"$(nproc)"
          make install

      - name: Write CMake toolchain file
        run: |
          cat > toolchain.cmake <<TOOLCHAIN
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR ${{ matrix.arch }})
          set(CMAKE_C_COMPILER ${TRIPLET}-gcc)
          set(CMAKE_CXX_COMPILER ${TRIPLET}-g++)
          set(CMAKE_FIND_ROOT_PATH / /usr/${TRIPLET} ${DEP_PREFIX}/${{ matrix.arch }} ${DEP_PREFIX})
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          TOOLCHAIN

      - name: Configure librnp
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=ON \
            -DDOWNLOAD_GTEST=ON \
            -DENABLE_DOC=OFF \
            -DCRYPTO_BACKEND=botan \
            -DBOTAN_ROOT_DIR="$DEP_PREFIX/${{ matrix.arch }}" \
            -DCMAKE_CROSSCOMPILING_EMULATOR="${QEMU_BIN};-L;/usr/${TRIPLET}" \
            .

      - name: Build librnp and the test suite
        run: cmake --build build --parallel "$(nproc)"

      - name: Verify binary architecture
        run: |
          file build/src/tests/rnp_tests
          file build/src/rnp/rnp

      - name: Run the full test suite under QEMU
        run: |
          cd build
          # binfmt-spawned qemu (used when the tests execute the
          # cross-compiled tools with system()) has no -L argument, so
          # point it at the target sysroot through the environment
          QEMU_LD_PREFIX="/usr/${TRIPLET}" ctest --output-on-failure
