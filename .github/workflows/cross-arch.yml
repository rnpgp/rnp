#
# Cross-compile smoke builds for the secondary Linux architectures, following
# the same pattern as the android workflow: Botan is cross-built on the
# x86_64 runner, librnp is built with the cross toolchain, and the full
# rnp_tests suite executes under QEMU user-mode emulation with the target
# sysroot.

name: cross-arch

on:
  push:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - '/*.sh'
      - '/.*'
      - '/_*'
      - 'Brewfile'
      - 'docs/**'
      - '**.adoc'
      - '**.md'
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/*.yml'
      - '!.github/workflows/cross-arch.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'ci/**'
      - '.github/workflows/cross-arch.yml'

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  cross-arch-build-test:
    name: ${{ matrix.arch }} linux cross-compile (botan backend)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            triplet: riscv64-linux-gnu
            dpkg_arch: riscv64
            botan_cpu: riscv64
            qemu: qemu-riscv64-static
          - arch: ppc64le
            triplet: powerpc64le-linux-gnu
            dpkg_arch: ppc64el
            botan_cpu: ppc64le
            qemu: qemu-ppc64le-static
          - arch: s390x
            triplet: s390x-linux-gnu
            dpkg_arch: s390x
            botan_cpu: s390x
            qemu: qemu-s390x-static
          - arch: armv7
            triplet: arm-linux-gnueabihf
            dpkg_arch: armhf
            botan_cpu: armv7
            qemu: qemu-arm-static

    env:
      TRIPLET: ${{ matrix.triplet }}
      DEP_PREFIX: ${{ github.workspace }}/cross-deps
      BOTAN_VERSION: "3.13.0"

    steps:
      - name: Checkout rnp
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Install cross toolchain and QEMU
        run: |
          # the foreign-architecture development libraries live exclusively in
          # the Ubuntu ports archive; the default archive and security sources
          # must be restricted to amd64 or apt-get update 404s on them fatally
          sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          echo "deb [arch=${{ matrix.dpkg_arch }}] http://ports.ubuntu.com/ $(. /etc/os-release && echo $VERSION_CODENAME) main universe" \
            | sudo tee /etc/apt/sources.list.d/ports.list
          sudo dpkg --add-architecture ${{ matrix.dpkg_arch }}
          sudo apt-get -y update
          sudo apt-get -y install cmake ninja-build python3 pkg-config \
            g++-${{ matrix.triplet }} \
            zlib1g-dev:${{ matrix.dpkg_arch }} libbz2-dev:${{ matrix.dpkg_arch }}
          # qemu-user-static is a real package up to Ubuntu 24.04; newer
          # runner images provide the same emulator through qemu-user-binfmt.
          sudo apt-get -y install qemu-user-static || sudo apt-get -y install qemu-user-binfmt

      - name: Locate QEMU emulator
        run: |
          QEMU_BIN="$(command -v ${{ matrix.qemu }} || command -v ${{ matrix.qemu }}-unescaped 2>/dev/null || command -v $(echo ${{ matrix.qemu }} | sed 's/-static$//'))"
          test -n "$QEMU_BIN"
          echo "QEMU_BIN=$QEMU_BIN" >> $GITHUB_ENV

      - name: Cache cross-built Botan
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ~/cross-deps/${{ matrix.arch }}
          key: crossarch-botan-${{ matrix.arch }}-${{ env.BOTAN_VERSION }}

      - name: Cross-build Botan
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/cross-deps" && cd "$HOME/cross-deps"
          curl -fSL --retry 3 -o botan.tar.xz \
            "https://botan.randombit.net/releases/Botan-${BOTAN_VERSION}.tar.xz"
          tar xJf botan.tar.xz
          cd "Botan-${BOTAN_VERSION}"
          python3 ./configure.py \
            --cc=gcc \
            --cc-bin="${TRIPLET}-g++" \
            --cpu=${{ matrix.botan_cpu }} \
            --os=linux \
            --minimized-build \
            --enable-modules="$(tr '\n' ',' < "$GITHUB_WORKSPACE/ci/botan3-modules" | sed 's/,$//')" \
            --build-targets=static \
            --without-documentation \
            --prefix="$HOME/cross-deps/${{ matrix.arch }}"
          make -j"$(nproc)"
          make install

      - name: Write CMake toolchain file
        run: |
          cat > toolchain.cmake <<TOOLCHAIN
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR ${{ matrix.arch }})
          set(CMAKE_C_COMPILER ${TRIPLET}-gcc)
          set(CMAKE_CXX_COMPILER ${TRIPLET}-g++)
          set(CMAKE_FIND_ROOT_PATH / /usr/${TRIPLET} ${DEP_PREFIX})
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          TOOLCHAIN

      - name: Configure librnp
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=ON \
            -DDOWNLOAD_GTEST=ON \
            -DENABLE_DOC=OFF \
            -DCRYPTO_BACKEND=botan \
            -DBOTAN_ROOT_DIR="$HOME/cross-deps/${{ matrix.arch }}" \
            -DCMAKE_CROSSCOMPILING_EMULATOR="${QEMU_BIN};-L;/usr/${TRIPLET}" \
            .

      - name: Build librnp and the test suite
        run: cmake --build build --parallel "$(nproc)"

      - name: Verify binary architecture
        run: |
          file build/src/tests/rnp_tests
          file build/src/rnp/rnp

      - name: Run the full test suite under QEMU
        run: |
          cd build
          RNP_TEST_DATA="$GITHUB_WORKSPACE/src/tests/data" \
            "${QEMU_BIN}" -L "/usr/${TRIPLET}" ./src/tests/rnp_tests
