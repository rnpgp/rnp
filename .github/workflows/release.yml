name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.18.1)'
        required: true
        type: string
      support_until:
        description: 'Declared support end date in YYYY-MM-DD format (defaults to 2 years from release date)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}

jobs:
  tarball:
    name: Build source tarball
    runs-on: ubuntu-latest
    container: ghcr.io/rnpgp/ci-rnp-fedora-40-amd64
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build source tarball
        run: |
          mkdir -p /opt/artifacts
          bash ci/build_tarball.sh "${RELEASE_TAG}"
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Stage artifacts
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cp /opt/artifacts/rnp-* "${GITHUB_WORKSPACE}/artifacts/"
          ls -la "${GITHUB_WORKSPACE}/artifacts/"

      - name: Upload tarball artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-tarball
          path: artifacts/
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download tarball artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: artifacts/

      - name: Prepare release notes
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk "/^### ${VERSION}/{flag=1; next} /^### /{flag=0} flag" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${RELEASE_TAG}" > release-notes.md
          fi
          cat release-notes.md
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release create "${RELEASE_TAG}" \
            artifacts/rnp-*.tar.gz artifacts/rnp-*.sha256 \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md

  # Build per-target static-library tarballs and attach them to the
  # release. Delegated to the reusable prebuilt.yml workflow so the
  # same matrix can be exercised on PRs (via the pull_request trigger
  # in prebuilt.yml) without creating a real release.
  prebuilt:
    name: Build prebuilt static-library tarballs
    needs: release
    uses: ./.github/workflows/prebuilt.yml
    # job-level with: of a reusable workflow caller cannot use the env
    # context (only github/needs/vars/inputs), which made GitHub reject the
    # whole workflow file on every run
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    secrets: inherit
    permissions:
      contents: write

  # Collect both the source tarball (from release) and all prebuilt
  # static-library tarballs (from prebuilt) into a single workflow
  # artifact so the reusable provenance workflow scans, validates,
  # and attests every published release tarball together.
  stage-provenance-artifacts:
    name: Stage release artifacts for provenance
    needs: [release, prebuilt]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      support_until: ${{ steps.meta.outputs.support_until }}
    steps:
      - name: Download release tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'rnp-*.tar.gz' \
            --dir release-artifacts \
            --clobber
          shopt -s nullglob
          tarballs=(release-artifacts/rnp-*.tar.gz)
          if (( ${#tarballs[@]} == 0 )); then
            echo "ERROR: no rnp-*.tar.gz assets found on release ${RELEASE_TAG}" >&2
            exit 1
          fi
          ls -la release-artifacts/

      - name: Resolve support-until date
        id: meta
        env:
          INPUT_SUPPORT_UNTIL: ${{ inputs.support_until }}
        run: |
          set -euo pipefail
          SUPPORT_UNTIL="${INPUT_SUPPORT_UNTIL:-$(date -u -d '+2 years' +%Y-%m-%d)}"
          echo "support_until=${SUPPORT_UNTIL}" >> "${GITHUB_OUTPUT}"

      - name: Upload staged release tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-provenance-artifacts
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 1

  provenance:
    name: Generate and attest release provenance
    needs: [release, prebuilt, stage-provenance-artifacts]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: riboseinc/provenance-release/.github/workflows/release.yml@ee9153324c45246fa4319cdbebc3ceb9865aa527
    with:
      artifacts: release-artifacts
      artifact-name: release-provenance-artifacts
      release-tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      support-until: ${{ needs.stage-provenance-artifacts.outputs.support_until }}
      author: "Ribose Inc."
      supplier: "Ribose Inc."
      attest: true
      upload-release: true
