[default]
extend-ignore-identifiers-re = [
    ".*fpr.*",
    ".*FPR.*",
    ".*[0-9a-fA-F]{4,}",
]

[default.extend-identifiers]
validate_desig_revokes = "validate_desig_revokes"
desig_rev = "desig_rev"
Nominet = "Nominet"
NOMINET = "NOMINET"
PNGs = "PNGs"
FOF = "FOF"
EDE3 = "EDE3"
ede3 = "ede3"
ffrom = "ffrom"
clen = "clen"
__THW_INTEL__ = "__THW_INTEL__"
unexpect_eof = "unexpect_eof"
unexpect_char = "unexpect_char"

[default.extend-words]
MERCHANTIBILITY = "MERCHANTIBILITY"
FOF = "FOF"
FO = "FO"
claus = "claus"
desig = "desig"
CNA = "CNA"
Sur = "Sur"
Collet = "Collet"

[files]
extend-exclude = [
    "src/tests/data/**",
    "src/libsexpp/**",
    # Generated roff (ci/regen-man-pages.sh); lint the .adoc sources instead
    "docs/man/**",
    "src/lib/nlohmann/**"
]
